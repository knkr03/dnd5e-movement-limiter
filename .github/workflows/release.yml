name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version and download URL from the release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" \
             --arg dl "https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}/module.zip" \
             '.version = $v | .download = $dl' module.json > module.tmp
          mv module.tmp module.json

      - name: Package module
        run: zip -r module.zip module.json scripts styles languages README.md LICENSE CHANGELOG.md

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
